[build]
builder = "NIXPACKS"

[[services]]
name = "frontend"
source = "frontend"
[services.build]
installCommand = "npm install"
buildCommand = "npm install && npm run build"
[services.deploy]
startCommand = "npm run start"
healthcheckPath = "/"
envVars = [
  "NEXT_PUBLIC_API_URL = https://<your-backend-service-name>.railway.app",
]

[[services]]
name = "backend"
source = "backend"
[services.build]
installCommand = "npm install"
buildCommand = "npm install && npx prisma generate && npx prisma migrate deploy && npm run build"
[services.deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
envVars = [
  "DATABASE_URL = <PostgreSQL-plugin-URI>",
  "JWT_SECRET = <64-char-random>",
  "SMTP_HOST = smtp.gmail.com",
  "SMTP_PORT = 587",
  "SMTP_USER = <gmail>",
  "SMTP_PASS = <app-password>",
  "ADMIN_EMAIL = admin@vxid.studio",
  "PORT = 8080",
  "NODE_ENV = production",
  "FRONTEND_URL = https://<your-frontend-service-name>.railway.app",
  "ADMIN_SEED_EMAIL = admin@vxid.studio",
  "ADMIN_SEED_PASSWORD = <choose-password>",
]
